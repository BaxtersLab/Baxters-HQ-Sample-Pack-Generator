[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hqspg"
version = "0.1.0"
description = "HQ Sample Pack Generator — Demucs + StemRepair + Extractor"
authors = [ { name = "Baxter" } ]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["audio", "demucs", "separation", "stems", "samples", "hqspg"]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Developers",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.10",
	"Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
	"PySide6",
	"numpy",
	"scipy",
	"demucs",
	"torch",
]

[project.urls]
Homepage = "https://github.com/your-org/hqspg"
Repository = "https://github.com/your-org/hqspg"
Documentation = "https://github.com/your-org/hqspg#readme"

[project.scripts]
hqspg = "hqspg.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["hqspg*"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-q"
