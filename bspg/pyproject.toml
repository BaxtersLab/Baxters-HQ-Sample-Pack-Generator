[project]
name = "bspg"
version = "0.0.0"
description = "Baxters Sample Pack Generator (BSPG) - GUI wrapper project"
authors = [{name = "Baxter", email = "baxter@example.com"}]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "PySide6",
    "pydantic",
    "rich",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["bspg*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[project.optional-dependencies]
dev = ["pytest", "ruff", "black"]
